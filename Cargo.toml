[package]
name = "burnrust"
version = "0.1.2"
edition = "2021"
description = "Native Rust laser control & design app (LightBurn-like) for GRBL diode lasers"
license = "MIT OR Apache-2.0"

# The produced executable is named "BurnRust" (the project's public name),
# while the crate itself stays lowercase to avoid Cargo's uppercase warnings.
[[bin]]
name = "BurnRust"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serialport = { version = "4.6", default-features = false }
image = "0.25"
usvg = "0.44"
ttf-parser = "0.24"
i_overlay = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
